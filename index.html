<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#173b2d">
    <title>Salto ao Sol</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="game" aria-label="Salto ao Sol">
      <section class="stage-shell" aria-label="Área de jogo">
        <canvas id="game-canvas" aria-label="Jogo Salto ao Sol"></canvas>
        <div id="hud" class="hud" aria-live="polite">
          <div class="hud-stat" aria-label="Altura atual">
            <span>Altura</span>
            <strong id="height-value">0 m</strong>
          </div>
          <div class="hud-stat" aria-label="Recorde de altura">
            <span>Recorde</span>
            <strong id="record-value">0 m</strong>
          </div>
          <p id="objective" class="objective">Toque à esquerda ou à direita para saltar.</p>
          <p id="pause-state" class="sr-only" aria-live="assertive">Jogo pronto</p>
        </div>
        <div id="screens" class="screens">
          <section id="ready-screen" class="screen-card" aria-label="Início da partida">
            <p class="eyebrow">SALTO AO SOL</p>
            <h1>Ajude Pip a subir.</h1>
            <p>Toque ou use ← → para guiar o broto entre as folhas.</p>
          </section>
          <section id="game-over-screen" class="screen-card" aria-label="Fim da partida" hidden>
            <p class="eyebrow">FIM DA SUBIDA</p>
            <h1>Pip precisa de mais uma tentativa.</h1>
            <p id="final-height">Altura: 0 m · Recorde: 0 m</p>
            <p id="next-unlock">Próximo: Broto com duas folhas</p>
            <button id="restart-button" type="button">Jogar novamente</button>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
