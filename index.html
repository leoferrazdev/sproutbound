<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#173b2d">
    <title>Sproutbound — Sunbound climb</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="game" aria-label="Sproutbound">
      <section class="stage-shell" aria-label="Game area">
        <canvas id="game-canvas" aria-label="Sproutbound game"></canvas>
        <div id="hud" class="hud" aria-live="polite">
          <div class="hud-stat" aria-label="Current height">
            <span>Height</span>
            <strong id="height-value">0 m</strong>
          </div>
          <div class="hud-stat" aria-label="Best height">
            <span>Best</span>
            <strong id="record-value">0 m</strong>
          </div>
          <p id="objective" class="objective">Tap left or right to guide Pip.</p>
          <p id="sun-counter" class="sun-counter" aria-label="Collected solar drops">Solar light: 0</p>
          <p id="pause-state" class="sr-only" aria-live="assertive">Game ready</p>
        </div>
        <div id="screens" class="screens">
          <section id="ready-screen" class="screen-card" aria-label="Start of the run">
            <p class="eyebrow">SUNBOUND CLIMB</p>
            <h1>Help Pip climb.</h1>
            <p>Tap or use ← → to guide the sprout between the leaves.</p>
          </section>
          <section id="game-over-screen" class="screen-card" aria-label="End of the run" hidden>
            <p id="ending-eyebrow" class="eyebrow">RUN OVER</p>
            <h1 id="ending-title">Pip needs another try.</h1>
            <p id="ending-message">All starting visuals unlocked</p>
            <p id="final-height">Height: 0 m · Best: 0 m</p>
            <p id="next-unlock">Next: Two-leaf sprout</p>
            <button id="restart-button" type="button">Play again</button>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
